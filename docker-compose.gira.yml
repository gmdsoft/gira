# Gira 배포 스택 (자체 postgres + 관리 서비스 포함). 절차: docs/deploy-alpha.md
# 실행: docker compose -f docker-compose.gira.yml up -d --build
# 필요한 .env 키: POSTGRES_PASSWORD (필수), ADMIN_EMAIL, ATLASSIAN_*(첨부 프록시용, 선택)
# 같은 호스트에 Gonfluence 스택도 올리는 경우: 관리 서비스는 한쪽만 켠다 (docs/deploy-alpha.md)
name: gira
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: gira
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rea} -d gira"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    command: ["node", "server/src/jira-viewer.mjs"]
    environment:
      GIRA_DATABASE_URL: postgres://${POSTGRES_USER:-rea}:${POSTGRES_PASSWORD}@postgres:5432/gira
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      # 프로필 이미지 업로드 프록시(GIRA-20) — 관리 서비스와 세션 쿠키를 공유한다
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      ORG_ADMIN_URL: ${ORG_ADMIN_URL:-http://admin:3003}
      ATLASSIAN_SITE: ${ATLASSIAN_SITE:-}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL:-}
      ATLASSIAN_API_TOKEN: ${ATLASSIAN_API_TOKEN:-}
    ports:
      - "${GIRA_PORT:-3002}:3002"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 조직 관리(사용자·팀·그룹) — 조직 테이블의 유일한 작성자.
  # 한 호스트에 두 스택을 올릴 때 포트가 겹치지 않도록 기본 호스트 포트는 3013.
  admin:
    build: .
    restart: unless-stopped
    command: ["node", "server/src/admin-app.mjs"]
    environment:
      ORG_DATABASE_URL: postgres://${POSTGRES_USER:-rea}:${POSTGRES_PASSWORD}@postgres:5432/gira
      ORG_MIRROR_DATABASE_URL: ${ORG_MIRROR_DATABASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-pottery@gmdsoft.com}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
    ports:
      - "${GIRA_ADMIN_PORT:-3013}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  appdata:
