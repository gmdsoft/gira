<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira PoC</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #fff; --line: #dfe1e6; --text: #172b4d; --dim: #6b778c;
    --accent: #0052cc; --new: #dfe1e6; --doing: #deebff; --done: #e3fcef;
    --new-t: #42526e; --doing-t: #0747a6; --done-t: #006644;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #f4f5f7; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #0747a6; }
  select, input, textarea { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font: inherit; }
  header { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header .poc { color: var(--dim); font-weight: normal; font-size: 12px; }
  .tabs { display: flex; gap: 2px; margin: 0 8px; }
  .tabs button { border: none; background: none; padding: 6px 10px; border-bottom: 2px solid transparent; border-radius: 0; }
  .tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  #who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); }
  .fbar { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fbar input[type=search] { width: 200px; }
  #count { color: var(--dim); font-size: 12px; }
  .badge { padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .cat-new { background: var(--new); color: var(--new-t); }
  .cat-indeterminate { background: var(--doing); color: var(--doing-t); }
  .cat-done { background: var(--done); color: var(--done-t); }
  .dim { color: var(--dim); font-size: 12px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .ilink { cursor: pointer; color: var(--accent); }

  main { height: calc(100vh - 96px); }
  .view { display: none; height: 100%; } .view.on { display: flex; }

  /* 목록 */
  #list { width: 440px; min-width: 300px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .row { padding: 8px 12px; border-bottom: 1px solid #f0f1f3; cursor: pointer; }
  .row:hover { background: #f4f5f7; }
  .row.sel { background: #e6effc; }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .key { color: var(--accent); font-size: 12px; white-space: nowrap; }
  .row .key.sub::before { content: "↳ "; color: var(--dim); }
  .row .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .row .meta { display: flex; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--dim); align-items: center; }
  #detail { flex: 1; overflow-y: auto; padding: 20px 28px; }
  #detail .placeholder { color: var(--dim); margin-top: 40px; text-align: center; }
  #detail h2 { margin: 4px 0 2px; font-size: 20px; }
  #detail .dkey { color: var(--dim); font-size: 13px; }
  .fields { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 14px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-width: 640px; font-size: 13px; align-items: center; }
  .fields dt { color: var(--dim); } .fields dd { margin: 0; }
  section h3 { font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 22px 0 10px; }
  .adf { max-width: 760px; }
  .adf p { margin: 6px 0; }
  .adf ul, .adf ol { margin: 6px 0; padding-left: 24px; }
  .adf pre { background: #f4f5f7; border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow-x: auto; font-size: 12px; }
  .adf code { background: #f4f5f7; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
  .adf pre code { background: none; padding: 0; }
  .adf blockquote { border-left: 3px solid var(--line); margin: 6px 0; padding: 2px 12px; color: var(--dim); }
  .adf table { border-collapse: collapse; margin: 8px 0; }
  .adf th, .adf td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  .adf th { background: #f4f5f7; }
  .adf .panel { border-radius: 4px; padding: 8px 12px; margin: 8px 0; background: #deebff; }
  .adf .panel.warning { background: #fffae6; } .adf .panel.error { background: #ffebe6; }
  .adf .panel.success { background: #e3fcef; } .adf .panel.note { background: #eae6ff; }
  .adf .media-ph { display: inline-block; border: 1px dashed var(--line); border-radius: 4px; padding: 6px 10px; color: var(--dim); font-size: 12px; background: #fafbfc; margin: 4px 4px 4px 0; }
  .adf .mention { background: #deebff; color: var(--doing-t); border-radius: 10px; padding: 0 5px; font-size: 13px; }
  .adf .status-lozenge { font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 3px; padding: 1px 5px; }
  .adf .inline-date { background: #f4f5f7; border-radius: 3px; padding: 0 4px; }
  .adf .expand { border: 1px solid var(--line); border-radius: 4px; margin: 8px 0; }
  .adf .expand > summary { padding: 6px 10px; cursor: pointer; font-weight: 600; }
  .adf .expand > .expand-body { padding: 2px 12px 8px; }
  .comment { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin: 10px 0; max-width: 760px; }
  .comment .chead { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .comment .chead b { color: var(--text); }
  .att-list, .link-list, .sub-list { list-style: none; padding: 0; margin: 0; max-width: 760px; }
  .att-list li, .link-list li, .sub-list li { padding: 5px 0; border-bottom: 1px solid #f0f1f3; display: flex; gap: 8px; align-items: baseline; }
  /* 공용: 우선순위 아이콘 · 아바타 · 에픽 색 막대 · 칩 */
  .prio { font-weight: 700; display: inline-block; min-width: 14px; text-align: center; }
  .av { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
        border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; vertical-align: middle; flex: none; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px;
          font-size: 11px; color: var(--dim); background: #fafbfc; white-space: nowrap; }
  .epicbar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }

  /* 이슈 상세 2단 레이아웃 */
  .dwrap { display: flex; gap: 24px; align-items: flex-start; }
  .dmain { flex: 1; min-width: 0; max-width: 860px; }
  .dside { width: 300px; flex: none; }
  .dcard { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-bottom: 12px; }
  .dcard > h4 { margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
  .dcard .body { padding: 10px 14px; }
  .dcard dl { display: grid; grid-template-columns: 90px 1fr; gap: 10px 10px; margin: 0; font-size: 13px; align-items: center; }
  .dcard dt { color: var(--dim); } .dcard dd { margin: 0; min-width: 0; }
  .dcard select { max-width: 100%; }
  .dtimes { padding: 8px 14px; border-top: 1px solid #f0f1f3; color: var(--dim); font-size: 12px; line-height: 1.7; }
  #d-status-top { font-weight: 700; padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer; }
  #d-status-top.cat-new { background: var(--new); color: var(--new-t); }
  #d-status-top.cat-indeterminate { background: var(--doing); color: var(--doing-t); }
  #d-status-top.cat-done { background: var(--done); color: var(--done-t); }

  /* 하위 작업 패널 */
  .subpanel { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .subpanel .phead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .subpanel .pbar { flex: 1; height: 6px; background: #ebecf0; border-radius: 3px; overflow: hidden; }
  .subpanel .pbar > div { height: 100%; background: #36b37e; }
  .subpanel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .subpanel th { text-align: left; font-size: 11px; color: var(--dim); padding: 4px 10px; border-top: 1px solid #f0f1f3; border-bottom: 1px solid #f0f1f3; background: #fafbfc; }
  .subpanel td { padding: 5px 10px; border-bottom: 1px solid #f7f8fa; }
  .subpanel .skey.done { text-decoration: line-through; }
  .subpanel select { font-size: 12px; padding: 2px 4px; }

  /* 백로그 계층 · 상태 요약 칩 */
  .srow { position: relative; padding-left: 38px; }
  .srow.child { padding-left: 64px; background: #fbfcfd; }
  .srow .twisty { position: absolute; left: 14px; width: 18px; border: none; background: none; cursor: pointer; color: var(--dim); padding: 0; font-size: 12px; }
  .catchips { display: inline-flex; gap: 3px; }
  .catchips span { min-width: 18px; text-align: center; border-radius: 3px; font-size: 11px; font-weight: 700; padding: 1px 4px; }

  /* 보드 카드 보강 */
  .card { position: relative; padding-left: 14px; }
  .card .labels { margin: 2px 0 4px; display: flex; flex-wrap: wrap; gap: 3px; }

  /* 표 그룹화 헤더 */
  table.issues tr.ghead td { background: #f4f5f7; font-weight: 700; font-size: 12px; color: var(--dim); position: sticky; }

  /* TipTap 편집기 */
  .editor-box { border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .editor-box .ProseMirror { outline: none; min-height: 200px; padding: 10px 14px; }
  .editor-box .ProseMirror table td, .editor-box .ProseMirror table th { min-width: 40px; }
  .editor-box .ProseMirror .selectedCell { background: #deebff; }
  .etoolbar { display: flex; gap: 2px; flex-wrap: wrap; border: 1px solid var(--line); border-bottom: none; border-radius: 4px 4px 0 0; background: #fafbfc; padding: 4px 6px; }
  .etoolbar + .editor-box { border-radius: 0 0 4px 4px; }
  .etoolbar button { border: none; background: none; padding: 3px 8px; border-radius: 3px; font-size: 13px; }
  .etoolbar button:hover { background: #ebecf0; }
  .etoolbar .sep { width: 1px; background: var(--line); margin: 2px 4px; }
  .fields select[multiple] { min-height: 70px; }
  .cform { max-width: 760px; margin-top: 8px; }
  .cform textarea { width: 100%; min-height: 70px; resize: vertical; }
  .cform .actions { margin-top: 6px; display: flex; gap: 8px; align-items: center; }

  /* 전체 목록 (표) */
  #tablewrap { flex: 1; overflow: auto; background: var(--panel); }
  table.issues { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.issues th, table.issues td { border-bottom: 1px solid #f0f1f3; border-right: 1px solid #f7f8fa; padding: 7px 10px; text-align: left; white-space: nowrap; }
  table.issues th { position: sticky; top: 0; background: #fafbfc; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
  table.issues th:hover { background: #f0f1f3; }
  table.issues th .arrow { color: var(--accent); margin-left: 3px; }
  table.issues td.c-sum { white-space: normal; min-width: 260px; max-width: 480px; }
  .ilink.done { text-decoration: line-through; }
  table.issues tr:hover td { background: #f7f9fc; }
  .tstatus { font-size: 12px; padding: 2px 4px; border-radius: 3px; border-color: transparent; font-weight: 600; cursor: pointer; }
  .tstatus.cat-new { background: var(--new); color: var(--new-t); }
  .tstatus.cat-indeterminate { background: var(--doing); color: var(--doing-t); }
  .tstatus.cat-done { background: var(--done); color: var(--done-t); }

  /* 보드 */
  .bbar { padding: 8px 16px 0; display: flex; gap: 8px; align-items: center; }
  #board { flex: 1; display: flex; gap: 10px; padding: 14px 16px; overflow-x: auto; align-items: flex-start; }
  .col { background: #f1f2f4; border-radius: 6px; flex: 1 1 0; min-width: 240px; max-height: 100%; display: flex; flex-direction: column; }
  .col h4 { margin: 0; padding: 10px 12px 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
  .col .cards { padding: 4px 8px 8px; overflow-y: auto; min-height: 60px; }
  .col.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; cursor: grab; box-shadow: 0 1px 1px rgba(9,30,66,.1); }
  .card .sum { font-size: 13px; margin-bottom: 4px; }
  .card .meta { display: flex; gap: 6px; font-size: 11px; color: var(--dim); align-items: center; justify-content: space-between; }
  .card.dragging { opacity: .4; }

  /* 백로그 */
  #backlog { flex: 1; overflow-y: auto; padding: 14px 24px; }
  .sprint { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 14px; max-width: 980px; }
  .sprint > .shead { padding: 10px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #f0f1f3; }
  .sprint > .shead b { font-size: 14px; }
  .sprint .goal { color: var(--dim); font-size: 12px; flex: 1; }
  .srow { display: flex; gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid #f7f8fa; }
  .srow .sum { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow select { font-size: 12px; padding: 2px 4px; }
  .sempty { padding: 12px 14px; color: var(--dim); font-size: 13px; }

  /* 모달 */
  .overlay { position: fixed; inset: 0; background: rgba(9,30,66,.5); display: none; align-items: flex-start; justify-content: center; z-index: 20; padding-top: 8vh; }
  .overlay.on { display: flex; }
  .modal { background: var(--panel); border-radius: 8px; width: 560px; max-width: 94vw; max-height: 84vh; overflow-y: auto; padding: 20px 24px; }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 3px; }
  .modal input[type=text], .modal select, .modal textarea { width: 100%; }
  .modal textarea { min-height: 100px; resize: vertical; }
  .modal .actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  #login .modal { width: 360px; text-align: center; }
  #login .acct { display: block; width: 100%; margin: 8px 0; padding: 10px; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>Jira <span class="poc">PoC</span></h1>
  <select id="f-project"></select>
  <nav class="tabs">
    <button data-view="list" class="on">목록</button>
    <button data-view="table">전체 목록</button>
    <button data-view="board">보드</button>
    <button data-view="backlog">백로그</button>
  </nav>
  <button id="btn-new" class="primary">+ 이슈 만들기</button>
  <span id="who"><span id="who-name"></span><button id="btn-logout">로그아웃</button></span>
</header>
<div class="fbar">
  <select id="f-status"><option value="">상태: 전체</option></select>
  <select id="f-type"><option value="">타입: 전체</option></select>
  <select id="f-assignee"><option value="">담당자: 전체</option></select>
  <select id="f-priority"><option value="">우선순위: 전체</option></select>
  <select id="f-sprint"><option value="">스프린트: 전체</option><option value="none">백로그(없음)</option></select>
  <input type="search" id="f-q" placeholder="검색 (요약·키)">
  <select id="f-group" title="전체 목록(표)에서 행을 묶어 보기">
    <option value="">그룹화: 없음</option>
    <option value="status">상태</option>
    <option value="assignee">담당자</option>
    <option value="type">타입</option>
    <option value="epic">에픽</option>
    <option value="priority">우선순위</option>
  </select>
  <button id="btn-clear">초기화</button>
  <span style="border-left:1px solid var(--line);height:20px"></span>
  <select id="f-saved"><option value="">저장된 필터…</option></select>
  <button id="btn-save-filter">현재 필터 저장</button>
  <button id="btn-del-filter" title="선택한 저장 필터 삭제">삭제</button>
  <span id="count"></span>
</div>
<main>
  <div class="view on" id="view-list">
    <div id="list"></div>
    <div id="detail"><div class="placeholder">왼쪽 목록에서 이슈를 선택하세요</div></div>
  </div>
  <div class="view" id="view-table"><div id="tablewrap"></div></div>
  <div class="view" id="view-board">
    <div style="display:flex;flex-direction:column;flex:1;min-width:0">
      <div class="bbar">
        <select id="board-sel"><option value="">기본 (모든 상태)</option></select>
        <button id="board-new">+ 보드 만들기</button>
        <button id="board-edit">편집</button>
        <button id="board-del">삭제</button>
        <span class="dim" id="board-hidden"></span>
      </div>
      <div id="board"></div>
    </div>
  </div>
  <div class="view" id="view-backlog"><div id="backlog"></div></div>
</main>

<div class="overlay" id="login"><div class="modal">
  <h2>로그인</h2><div class="dim" style="margin-bottom:10px">계정을 선택하세요 (개발용)</div>
  <div id="login-accounts"></div>
</div></div>

<div class="overlay" id="board-modal"><div class="modal">
  <h2 id="bm-title">보드 만들기</h2>
  <label>보드 이름 *</label><input type="text" id="bm-name">
  <label>컬럼 구성 * <span class="dim">(각 컬럼에 포함할 상태 선택, 상태는 한 컬럼에만)</span></label>
  <div id="bm-cols"></div>
  <button id="bm-add-col" style="margin-top:8px">+ 컬럼 추가</button>
  <div class="actions"><button id="bm-cancel">취소</button><button id="bm-save" class="primary">저장</button></div>
</div></div>

<div class="overlay" id="new-issue"><div class="modal">
  <h2>이슈 만들기</h2>
  <label>타입</label><select id="n-type"></select>
  <div id="n-parent-wrap" style="display:none"><label>상위 이슈 키 (하위 작업용, 예: SIMSIM-10)</label>
    <input type="text" id="n-parent" placeholder="SIMSIM-10"></div>
  <label>요약 *</label><input type="text" id="n-summary">
  <label>설명</label><textarea id="n-desc" placeholder="플레인 텍스트 (PoC)"></textarea>
  <label>담당자</label><select id="n-assignee"><option value="">미지정</option></select>
  <label>우선순위</label><select id="n-priority"><option value="">없음</option></select>
  <label>스프린트</label><select id="n-sprint"><option value="">백로그</option></select>
  <div class="actions"><button id="n-cancel">취소</button><button id="n-create" class="primary">만들기</button></div>
</div></div>

<script src="/jira-editor.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = (s) => s ? new Date(s).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const size = (n) => n == null ? '' : n > 1048576 ? (n/1048576).toFixed(1)+' MB' : n > 1024 ? (n/1024).toFixed(0)+' KB' : n+' B';

// 우선순위 아이콘 (Jira 톤: Highest/High 빨강 ↑, Normal 주황 =, Low/Lowest 파랑 ↓)
const PRIO = { Highest: ['⇈', '#d04437'], High: ['↑', '#d04437'], Normal: ['〓', '#f79232'],
               Medium: ['〓', '#f79232'], Low: ['↓', '#0747a6'], Lowest: ['⇊', '#0747a6'] };
const prioIcon = (p) => p ? `<span class="prio" style="color:${PRIO[p]?.[1] ?? '#6b778c'}" title="${esc(p)}">${PRIO[p]?.[0] ?? '•'}</span>` : '';
// 아바타(이니셜 원) — 이름 해시로 색 고정
const PALETTE = ['#0052cc','#00875a','#ff8b00','#de350b','#5243aa','#00a3bf','#403294','#e56910','#216e4e','#943d73'];
const hashColor = (s) => PALETTE[[...String(s ?? '')].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % PALETTE.length];
const avatar = (name) => name ? `<span class="av" style="background:${hashColor(name)}" title="${esc(name)}">${esc(String(name).trim()[0] ?? '?')}</span>` : '';
// 에픽 색 막대 (에픽 id 해시로 색 고정)
const epicBar = (r) => r.epic_id ? `<span class="epicbar" style="background:${hashColor(r.epic_id)}" title="${esc(r.epic_key)} ${esc(r.epic_summary ?? '')}"></span>` : '';
// 상태 카테고리별 건수 요약 칩 3개 (회색=할일, 파랑=진행, 초록=완료)
const catChips = (rows) => {
  const c = { new: 0, indeterminate: 0, done: 0 };
  for (const r of rows) c[r.status_category] = (c[r.status_category] ?? 0) + 1;
  return `<span class="catchips"><span class="cat-new">${c.new}</span><span class="cat-indeterminate">${c.indeterminate}</span><span class="cat-done">${c.done}</span></span>`;
};
async function api(url, opts = {}) {
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers = { 'content-type': 'application/json' }; }
  const res = await fetch(url, opts);
  if (res.status === 401) { showLogin(); throw new Error('login'); }
  if (!res.ok) { const e = await res.json().catch(() => ({})); alert(e.error ?? `오류 (${res.status})`); throw new Error(e.error ?? res.status); }
  return res.json();
}

// ---------- ADF 렌더러 ----------
function marksWrap(text, marks) {
  let out = esc(text);
  for (const m of marks ?? []) {
    if (m.type === 'strong') out = `<strong>${out}</strong>`;
    else if (m.type === 'em') out = `<em>${out}</em>`;
    else if (m.type === 'underline') out = `<u>${out}</u>`;
    else if (m.type === 'strike') out = `<s>${out}</s>`;
    else if (m.type === 'code') out = `<code>${out}</code>`;
    else if (m.type === 'link') out = `<a href="${esc(m.attrs?.href)}" target="_blank" rel="noopener">${out}</a>`;
    else if (m.type === 'textColor') out = `<span style="color:${esc(m.attrs?.color)}">${out}</span>`;
    else if (m.type === 'subsup') out = m.attrs?.type === 'sub' ? `<sub>${out}</sub>` : `<sup>${out}</sup>`;
  }
  return out;
}
function adf(node) {
  if (!node) return '';
  const kids = () => (node.content ?? []).map(adf).join('');
  switch (node.type) {
    case 'doc': return kids();
    case 'paragraph': return `<p>${kids() || '&nbsp;'}</p>`;
    case 'text': return marksWrap(node.text, node.marks);
    case 'heading': { const l = Math.min(6, node.attrs?.level ?? 1); return `<h${l}>${kids()}</h${l}>`; }
    case 'bulletList': return `<ul>${kids()}</ul>`;
    case 'orderedList': return `<ol>${kids()}</ol>`;
    case 'listItem': return `<li>${kids()}</li>`;
    case 'taskList': return `<ul style="list-style:none;padding-left:16px">${kids()}</ul>`;
    case 'taskItem': return `<li>${node.attrs?.state === 'DONE' ? '☑' : '☐'} ${kids()}</li>`;
    case 'codeBlock': return `<pre><code>${(node.content ?? []).map((t) => esc(t.text)).join('')}</code></pre>`;
    case 'blockquote': return `<blockquote>${kids()}</blockquote>`;
    case 'panel': return `<div class="panel ${esc(node.attrs?.panelType ?? 'info')}">${kids()}</div>`;
    case 'rule': return '<hr>';
    case 'hardBreak': return '<br>';
    case 'mention': return `<span class="mention">@${esc(node.attrs?.text?.replace(/^@/, '') ?? '?')}</span>`;
    case 'emoji': return esc(node.attrs?.text ?? node.attrs?.shortName ?? '');
    case 'date': return `<span class="inline-date">${node.attrs?.timestamp ? new Date(Number(node.attrs.timestamp)).toLocaleDateString('ko-KR') : ''}</span>`;
    case 'status': { const c = { green: 'cat-done', blue: 'cat-indeterminate', neutral: 'cat-new', red: 'cat-new', yellow: 'cat-indeterminate', purple: 'cat-indeterminate' }[node.attrs?.color] ?? 'cat-new';
      return `<span class="status-lozenge ${c}">${esc(node.attrs?.text)}</span>`; }
    case 'table': return `<table>${kids()}</table>`;
    case 'tableRow': return `<tr>${kids()}</tr>`;
    case 'tableHeader': return `<th>${kids()}</th>`;
    case 'tableCell': return `<td>${kids()}</td>`;
    case 'mediaSingle': case 'mediaGroup': return kids();
    case 'media': return `<span class="media-ph">📎 ${esc(node.attrs?.alt || '첨부 미디어')} <span class="dim">(첨부 목록 참조)</span></span>`;
    case 'inlineCard': return `<a href="${esc(node.attrs?.url)}" target="_blank" rel="noopener">${esc(node.attrs?.url)}</a>`;
    case 'expand': case 'nestedExpand':
      return `<details class="expand"><summary>${esc(node.attrs?.title || '펼치기')}</summary><div class="expand-body">${kids()}</div></details>`;
    default: return kids();
  }
}

// ADF → 플레인 텍스트 (편집 폼 프리필용. 서식은 보존되지 않는다)
function adfToText(node, depth = 0) {
  if (!node) return '';
  const kids = (d = depth) => (node.content ?? []).map((c) => adfToText(c, d)).join('');
  switch (node.type) {
    case 'text': return node.text ?? '';
    case 'hardBreak': return '\n';
    case 'mention': return '@' + (node.attrs?.text?.replace(/^@/, '') ?? '');
    case 'emoji': return node.attrs?.text ?? node.attrs?.shortName ?? '';
    case 'paragraph': case 'heading': return kids() + '\n';
    case 'listItem': return '  '.repeat(depth) + '- ' + kids(depth + 1).replace(/\n+$/, '') + '\n';
    case 'codeBlock': return kids() + '\n';
    case 'tableRow': return (node.content ?? []).map((c) => adfToText(c, depth).trim()).join(' | ') + '\n';
    case 'media': return `(첨부: ${node.attrs?.alt ?? '미디어'})\n`;
    case 'rule': return '---\n';
    default: return kids();
  }
}
const hasRichContent = (node) => {
  if (!node) return false;
  if (['table', 'media', 'panel', 'expand', 'codeBlock', 'status', 'date'].includes(node.type)) return true;
  if ((node.marks ?? []).length) return true;
  return (node.content ?? []).some(hasRichContent);
};

let meta = null, sprints = [], versions = [], boards = [], savedFilters = [], me = null, selKey = null, curView = 'list';
const FILTER_IDS = ['#f-status', '#f-type', '#f-assignee', '#f-priority', '#f-sprint'];
const filterParams = () => {
  const qs = new URLSearchParams();
  qs.set('project', $('#f-project').value);
  const map = { '#f-status': 'status', '#f-type': 'type', '#f-assignee': 'assignee', '#f-priority': 'priority', '#f-sprint': 'sprint' };
  for (const [el, k] of Object.entries(map)) if ($(el).value) qs.set(k, $(el).value);
  if ($('#f-q').value) qs.set('q', $('#f-q').value);
  return qs;
};

async function loadSprints() {
  const proj = encodeURIComponent($('#f-project').value);
  [sprints, versions, boards] = await Promise.all([
    api('/api/sprints?project=' + proj), api('/api/versions?project=' + proj), api('/api/boards?project=' + proj)]);
  const cur = $('#board-sel').value;
  $('#board-sel').innerHTML = '<option value="">기본 (모든 상태)</option>' +
    boards.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  if (boards.some((b) => String(b.id) === cur)) $('#board-sel').value = cur;
  const open = sprints.filter((s) => s.state !== 'closed');
  const opts = open.map((s) => `<option value="${s.id}">${esc(s.name)}${s.state === 'active' ? ' (활성)' : ''}</option>`).join('');
  $('#f-sprint').innerHTML = '<option value="">스프린트: 전체</option><option value="none">백로그(없음)</option>' + opts;
  $('#n-sprint').innerHTML = '<option value="">백로그</option>' + opts;
}
async function loadSavedFilters() {
  savedFilters = await api('/api/filters');
  $('#f-saved').innerHTML = '<option value="">저장된 필터…</option>' +
    savedFilters.map((f) => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
}
function refresh() {

// ---------- URL 라우팅 (Jira처럼 주소창에 반영) ----------
// /browse/<이슈키> · /projects/<프로젝트>/<list|table|board|backlog>
const VIEW_NAMES = { list: '목록', table: '전체 목록', board: '보드', backlog: '백로그' };
function setUrl(path, title) {
  if (location.pathname !== path) history.pushState({}, '', path);
  if (title) document.title = title;
}
function syncViewUrl() {
  const proj = $('#f-project').value;
  setUrl(`/projects/${encodeURIComponent(proj)}/${curView}`, `${proj} ${VIEW_NAMES[curView]} - Jira PoC`);
}
function switchView(view) {
  curView = view;
  $$('.tabs button').forEach((x) => x.classList.toggle('on', x.dataset.view === view));
  $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'view-' + view));
}
async function applyRoute() {
  const m1 = location.pathname.match(/^\/browse\/([A-Za-z][A-Za-z0-9]*-\d+)$/);
  const m2 = location.pathname.match(/^\/projects\/([^/]+)\/(list|table|board|backlog)$/);
  if (m1) {
    const key = m1[1].toUpperCase();
    const pkey = key.split('-')[0];
    if (meta.projects.some((p) => p.key === pkey) && $('#f-project').value !== pkey) {
      $('#f-project').value = pkey;
      await loadSprints();
    }
    switchView('list');
    loadList();
    openIssue(key, false, false);
  } else if (m2 && meta.projects.some((p) => p.key === decodeURIComponent(m2[1]))) {
    const pkey = decodeURIComponent(m2[1]);
    if ($('#f-project').value !== pkey) { $('#f-project').value = pkey; await loadSprints(); }
    switchView(m2[2]);
    refresh();
    document.title = `${pkey} ${VIEW_NAMES[m2[2]]} - Jira PoC`;
  } else {
    switchView(curView);
    refresh();
    syncViewUrl();
  }
}
window.addEventListener('popstate', () => applyRoute());

// ---------- 탭 ----------
$$('.tabs button').forEach((b) => b.addEventListener('click', () => {
  switchView(b.dataset.view);
  refresh();
  syncViewUrl();
}));

    </div>`).join('');
}

// ---------- 상세 (Jira식 2단: 본문 가변 + 우측 고정 패널) ----------
async function openIssue(key, switchTab = false, push = true) {
  if (switchTab && curView !== 'list') { switchView('list'); loadList(); }
  selKey = key;
  $$('.row').forEach((el) => el.classList.toggle('sel', el.dataset.key === key));
  const d = await api('/api/issue/' + encodeURIComponent(key));
  if (push) setUrl('/browse/' + encodeURIComponent(key), `[${key}] ${d.summary} - Jira PoC`);
  else document.title = `[${key}] ${d.summary} - Jira PoC`;
  const opt = (v, t, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(t)}</option>`;
  const statusSel = meta.statuses.map((s) => opt(s.id, s.name, s.id === d.status_id)).join('');
  const assigneeSel = '<option value="">미지정</option>' + meta.assignees.map((u) => opt(u.id, u.display_name, u.id === d.assignee_id)).join('');
  const sprintSel = '<option value="">백로그</option>' + sprints.filter((s) => s.state !== 'closed' || s.id === d.sprint_id)
    .map((s) => opt(s.id, s.name + (s.state === 'active' ? ' (활성)' : s.state === 'closed' ? ' (완료)' : ''), s.id === d.sprint_id)).join('');
  const typeSel = meta.types.map((t) => opt(t.id, t.name, t.id === d.issue_type_id)).join('');
  const prioSel = '<option value="">없음</option>' + meta.priorities.map((p) => opt(p, p, p === d.priority)).join('');
  const resoList = [...new Set([...meta.resolutions, ...(d.resolution ? [d.resolution] : [])])];
  const resoSel = '<option value="">미해결</option>' + resoList.map((r) => opt(r, r, r === d.resolution)).join('');
  const verNames = [...new Set([...versions.map((v) => v.name), ...(d.fix_versions ?? [])])];
  const verSel = verNames.map((v) => opt(v, v, (d.fix_versions ?? []).includes(v))).join('');
  const linkRow = (l) => {
    const mine = l.inward_key === key;
    const otherKey = mine ? l.outward_key : l.inward_key;
    const otherSum = mine ? l.outward_summary : l.inward_summary;
    return `<li><span class="dim">${esc(l.link_type)}</span>
      ${otherKey ? `<span class="ilink" data-key="${esc(otherKey)}">${esc(otherKey)}</span> ${esc(otherSum ?? '')}` : '<span class="dim">(이관 범위 밖 이슈)</span>'}</li>`;
  };

  // 하위 작업 패널: 진행률(완료 카테고리 비율) + 표(인라인 상태 변경)
  const doneCnt = d.subtasks.filter((s) => s.status_category === 'done').length;
  const pct = d.subtasks.length ? Math.round(doneCnt * 100 / d.subtasks.length) : 0;
  const subPanel = d.subtasks.length ? `
    <section><h3>하위 작업 (${d.subtasks.length})</h3>
    <div class="subpanel">
      <div class="phead"><div class="pbar"><div style="width:${pct}%"></div></div><span class="dim">${pct}% 완료</span></div>
      <table><thead><tr><th>업무</th><th>타입</th><th>우선 순위</th><th>담당자</th><th>상태</th></tr></thead>
      <tbody>${d.subtasks.map((s) => `
        <tr>
          <td><span class="ilink skey${s.status_category === 'done' ? ' done' : ''}" data-key="${esc(s.issue_key)}">${esc(s.issue_key)}</span>
              <span class="ilink" data-key="${esc(s.issue_key)}" style="color:inherit">${esc(s.summary)}</span></td>
          <td class="dim">${esc(s.type_name ?? '')}</td>
          <td>${prioIcon(s.priority)} ${esc(s.priority ?? '')}</td>
          <td>${avatar(s.assignee_name)} ${esc(s.assignee_name ?? '')}</td>
          <td><select class="st-status tstatus cat-${esc(s.status_category)}" data-key="${esc(s.issue_key)}">${
            meta.statuses.map((st) => opt(st.id, st.name, st.id === s.status_id)).join('')}</select></td>
        </tr>`).join('')}</tbody></table>
    </div></section>` : '';

  // 브레드크럼 부모 슬롯: 부모 키 또는 "상위 항목 추가"
  const parentSlot = d.parent_key
    ? `<span class="ilink" data-key="${esc(d.parent_key)}" title="${esc(d.parent_summary ?? '')}">${esc(d.parent_key)}</span>
       <button id="d-parent" class="dim" style="border:none;background:none;cursor:pointer;padding:0 2px" title="상위 항목 변경">✎</button> / `
    : `<button id="d-parent" style="font-size:12px;padding:1px 6px">상위 항목 추가</button> / `;

  $('#detail').innerHTML = `
    <div class="dkey">${parentSlot}${esc(d.issue_key)}
      <button id="d-edit" style="margin-left:8px;font-size:12px;padding:2px 8px">편집</button></div>
    <h2>${esc(d.summary)}</h2>
    <div class="dwrap">
      <div class="dmain">
        <section><h3>설명</h3><div class="adf">${d.description_adf ? adf(d.description_adf) : '<span class="dim">없음</span>'}</div></section>
        ${subPanel}
        ${d.links.length ? `<section><h3>연결된 업무 항목 (${d.links.length})</h3><ul class="link-list">${d.links.map(linkRow).join('')}</ul></section>` : ''}
        <section><h3>첨부 파일 (${d.attachments.length})</h3>
          <ul class="att-list">${d.attachments.map((a) =>
            `<li><a href="/api/attachment/${a.id}" target="_blank">${esc(a.filename)}</a><span class="dim">${size(a.file_size)} · ${dt(a.created_at)}</span></li>`).join('')}</ul>
          <div class="cform"><input type="file" id="d-file"> <button id="d-upload">업로드</button></div>
        </section>
        <section><h3>댓글 (${d.comments.length})</h3>
          ${d.comments.map((c) => `<div class="comment"><div class="chead">${avatar(c.author_name)} <b>${esc(c.author_name ?? '?')}</b> · ${dt(c.created_at)}</div>
            <div class="adf">${c.body_adf ? adf(c.body_adf) : ''}</div></div>`).join('')}
          <div class="cform"><textarea id="d-comment" placeholder="댓글 입력 (플레인 텍스트)"></textarea>
            <div class="actions"><button id="d-comment-add" class="primary">댓글 달기</button></div></div>
        </section>
      </div>
      <div class="dside">
        <div style="margin-bottom:12px"><select id="d-status" class="tstatus cat-${esc(d.status_category)}" style="font-size:13px;padding:5px 8px">${statusSel}</select>
          ${d.resolved_at ? `<span class="dim" style="margin-left:6px">✓ ${esc(d.resolution ?? '해결됨')}</span>` : ''}</div>
        <div class="dcard"><h4>세부 사항</h4><div class="body"><dl>
          <dt>담당자</dt><dd><select id="d-assignee">${assigneeSel}</select></dd>
          <dt>보고자</dt><dd>${avatar(d.reporter_name)} ${esc(d.reporter_name ?? '-')}</dd>
          <dt>타입</dt><dd><select id="d-type">${typeSel}</select></dd>
          <dt>우선순위</dt><dd><select id="d-priority">${prioSel}</select></dd>
          <dt>스프린트</dt><dd><select id="d-sprint">${sprintSel}</select></dd>
          <dt>해결</dt><dd><select id="d-resolution">${resoSel}</select></dd>
          <dt>수정 버전</dt><dd><select id="d-fixver" multiple size="${Math.min(4, Math.max(2, verNames.length))}" title="Ctrl 클릭으로 복수 선택">${verSel}</select></dd>
          ${d.labels?.length ? `<dt>라벨</dt><dd>${d.labels.map((l) => `<span class="chip">${esc(l)}</span>`).join(' ')}</dd>` : ''}
          ${d.components?.length ? `<dt>컴포넌트</dt><dd>${d.components.map((c) => `<span class="chip">${esc(c)}</span>`).join(' ')}</dd>` : ''}
        </dl></div>
        <div class="dtimes">만듦 ${dt(d.created_at)}<br>업데이트 ${dt(d.updated_at)}${d.resolved_at ? `<br>해결됨 ${dt(d.resolved_at)}` : ''}</div>
        </div>
      </div>
    </div>`;
  $('#detail').scrollTop = 0;

  const patch = (json, reload = true) => api('/api/issue/' + encodeURIComponent(key), { method: 'PATCH', json })
    .then(() => { if (reload) { openIssue(key); if (curView === 'list') loadList(); } });
  $('#d-edit').addEventListener('click', () => renderEditForm(d));
  $('#d-parent').addEventListener('click', async () => {
    const v = prompt('상위 이슈 키 (비우면 상위 해제)', d.parent_key ?? '');
    if (v === null) return;
    patch({ parentKey: v.trim() });
  });
  $('#d-status').addEventListener('change', (e) => patch({ statusId: Number(e.target.value) }));
  $('#d-assignee').addEventListener('change', (e) => patch({ assigneeId: e.target.value ? Number(e.target.value) : null }));
  $('#d-sprint').addEventListener('change', (e) => patch({ sprintId: e.target.value ? Number(e.target.value) : null }));
  $('#d-type').addEventListener('change', (e) => patch({ typeId: Number(e.target.value) }));
  $('#d-priority').addEventListener('change', (e) => patch({ priority: e.target.value || null }));
  $('#d-resolution').addEventListener('change', (e) => patch({ resolution: e.target.value || null }));
  $('#d-fixver').addEventListener('change', (e) => {
    patch({ fixVersions: [...e.target.selectedOptions].map((o) => o.value) }, false);
  });
  // 하위 작업 인라인 상태 변경
  $$('#detail .st-status').forEach((sel) => sel.addEventListener('change', async () => {
    await api('/api/issue/' + encodeURIComponent(sel.dataset.key), { method: 'PATCH', json: { statusId: Number(sel.value) } });
    openIssue(key);
  }));
  $('#d-comment-add').addEventListener('click', async () => {
    const text = $('#d-comment').value.trim();
    if (!text) return;
    await api('/api/issue/' + encodeURIComponent(key) + '/comments', { method: 'POST', json: { text } });
    openIssue(key);
  });
  $('#d-upload').addEventListener('click', async () => {
    const f = $('#d-file').files[0];
    if (!f) return alert('파일을 선택하세요');
    const fd = new FormData(); fd.append('file', f);
    await api('/api/issue/' + encodeURIComponent(key) + '/attachments', { method: 'POST', body: fd });
    openIssue(key);
  });
}

// ---------- 이슈 편집 (TipTap) ----------
const TOOLBAR = [
  ['bold', '<b>B</b>'], ['italic', '<i>I</i>'], ['underline', '<u>U</u>'], ['strike', '<s>S</s>'], ['code', '&lt;/&gt;'],
  ['|'], ['h2', 'H2'], ['h3', 'H3'],
  ['|'], ['bullet', '• 목록'], ['ordered', '1. 목록'],
  ['|'], ['quote', '❝ 인용'], ['codeblock', '코드'], ['hr', '―'],
  ['|'], ['link', '🔗 링크'], ['table', '표'],
];
function runEditorCmd(ed, cmd) {
  const c = ed.chain().focus();
  switch (cmd) {
    case 'bold': return c.toggleBold().run();
    case 'italic': return c.toggleItalic().run();
    case 'underline': return c.toggleMark('underline').run();
    case 'strike': return c.toggleStrike().run();
    case 'code': return c.toggleCode().run();
    case 'h2': return c.toggleHeading({ level: 2 }).run();
    case 'h3': return c.toggleHeading({ level: 3 }).run();
    case 'bullet': return c.toggleBulletList().run();
    case 'ordered': return c.toggleOrderedList().run();
    case 'quote': return c.toggleBlockquote().run();
    case 'codeblock': return c.toggleCodeBlock().run();
    case 'hr': return c.setHorizontalRule().run();
    case 'link': {
      const url = prompt('링크 URL (비우면 제거)');
      if (url === null) return;
      return url.trim() ? c.toggleMark('link', { href: url.trim() }).run() : c.unsetMark('link').run();
    }
    case 'table': return c.insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
  }
}
function renderEditForm(d) {
  const key = d.issue_key;
  const simplified = hasRichContent(d.description_adf);
  $('#detail').innerHTML = `
    <div class="dkey">${esc(key)} 편집</div>
    <div style="max-width:760px">
      <label class="dim" style="display:block;margin:12px 0 3px">요약 *</label>
      <input type="text" id="e-summary" style="width:100%" value="${esc(d.summary)}">
      <label class="dim" style="display:block;margin:12px 0 3px">라벨 (쉼표 구분)</label>
      <input type="text" id="e-labels" style="width:100%" value="${esc((d.labels ?? []).join(', '))}">
      <label class="dim" style="display:block;margin:12px 0 3px">설명</label>
      ${simplified ? '<div class="adf"><div class="panel warning" style="font-size:12px">패널·이미지·멘션 등 일부 요소는 편집기에서 단순화되어 표시됩니다. 저장하면 단순화된 형태로 대체됩니다.</div></div>' : ''}
      <div class="etoolbar">${TOOLBAR.map(([cmd, label]) =>
        cmd === '|' ? '<span class="sep"></span>' : `<button data-cmd="${cmd}" title="${cmd}">${label}</button>`).join('')}</div>
      <div class="editor-box adf" id="e-desc-ed"></div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="e-save" class="primary">저장</button><button id="e-cancel">취소</button>
      </div>
    </div>`;
  const ed = JiraEditor.mount($('#e-desc-ed'), d.description_adf);
  $$('.etoolbar button').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); runEditorCmd(ed.editor, b.dataset.cmd); }));
  $('#e-cancel').addEventListener('click', () => { ed.destroy(); openIssue(key); });
  $('#e-save').addEventListener('click', async () => {
    const summary = $('#e-summary').value.trim();
    if (!summary) return alert('요약을 입력하세요');
    const descriptionAdf = ed.getADF();
    await api('/api/issue/' + encodeURIComponent(key), { method: 'PATCH', json: {
      summary,
      labels: $('#e-labels').value.split(',').map((s) => s.trim()).filter(Boolean),
      descriptionAdf,
    }});
    ed.destroy();
    openIssue(key);
    refresh();
  });
}

// ---------- 전체 목록 (표) ----------
let tableRows = [];
let tableSort = { field: 'key', dir: -1 };
const PRIORITY_ORDER = { Highest: 0, High: 1, Normal: 2, Medium: 2, Low: 3, Lowest: 4 };
const keyNum = (k) => Number(String(k).split('-')[1] ?? 0);
const SORTERS = {
  key: (a, b) => keyNum(a.issue_key) - keyNum(b.issue_key),
  summary: (a, b) => (a.summary ?? '').localeCompare(b.summary ?? '', 'ko'),
  type: (a, b) => (a.type_name ?? '').localeCompare(b.type_name ?? '', 'ko'),
  assignee: (a, b) => (a.assignee_name ?? '힣힣').localeCompare(b.assignee_name ?? '힣힣', 'ko'),
  reporter: (a, b) => (a.reporter_name ?? '힣힣').localeCompare(b.reporter_name ?? '힣힣', 'ko'),
  priority: (a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9),
  status: (a, b) => (a.status_name ?? '').localeCompare(b.status_name ?? '', 'ko'),
  resolution: (a, b) => (a.resolution ?? '힣힣').localeCompare(b.resolution ?? '힣힣', 'ko'),
  created: (a, b) => new Date(a.created_at ?? 0) - new Date(b.created_at ?? 0),
  updated: (a, b) => new Date(a.updated_at ?? 0) - new Date(b.updated_at ?? 0),
};
const TABLE_COLS = [
  ['key', '키'], ['summary', '업무'], ['type', '타입'], ['assignee', '담당자'], ['reporter', '보고자'],
  ['priority', '우선 순위'], ['status', '상태'], ['resolution', '해결'], ['created', '만듦'], ['updated', '업데이트됨'],
];
async function loadTable() {
  tableRows = await api('/api/issues?' + filterParams());
  $('#count').textContent = `${tableRows.length}건`;
  renderTable();
}
const GROUPERS = {
  status: (r) => r.status_name ?? '(없음)',
  assignee: (r) => r.assignee_name ?? '(미지정)',
  type: (r) => r.type_name ?? '(없음)',
  epic: (r) => r.epic_key ? `${r.epic_key} ${r.epic_summary ?? ''}` : '(에픽 없음)',
  priority: (r) => r.priority ?? '(없음)',
};
function renderTable() {
  const rows = [...tableRows].sort((a, b) => tableSort.dir * SORTERS[tableSort.field](a, b));
  const groupKey = $('#f-group').value;
  const statusOpts = (cur) => meta.statuses.map((s) =>
    `<option value="${s.id}"${String(s.id) === String(cur) ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  // 그룹화: 정렬된 행을 그룹 라벨로 묶고 그룹 헤더 행을 끼워 넣는다
  let ordered = rows;
  if (groupKey) {
    const groups = new Map();
    for (const r of rows) {
      const g = GROUPERS[groupKey](r);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(r);
    }
    ordered = [];
    for (const [g, list] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ko'))) {
      ordered.push({ __group: g, __count: list.length });
      ordered.push(...list);
    }
  }
  $('#tablewrap').innerHTML = `<table class="issues">
    <thead><tr>${TABLE_COLS.map(([f, label]) =>
      `<th data-field="${f}">${label}${tableSort.field === f ? `<span class="arrow">${tableSort.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${ordered.map((r) => r.__group !== undefined
      ? `<tr class="ghead"><td colspan="${TABLE_COLS.length}">${esc(r.__group)} <span class="dim">${r.__count}건</span></td></tr>`
      : `
      <tr>
        <td><span class="ilink${r.status_category === 'done' ? ' done' : ''}" data-key="${esc(r.issue_key)}">${esc(r.issue_key)}</span></td>
        <td class="c-sum">${esc(r.summary)}</td>
        <td>${esc(r.type_name ?? '')}</td>
        <td>${esc(r.assignee_name ?? '')}</td>
        <td>${esc(r.reporter_name ?? '')}</td>
        <td>${esc(r.priority ?? '')}</td>
        <td><select class="tstatus cat-${esc(r.status_category)}" data-key="${esc(r.issue_key)}">${statusOpts(r.status_id)}</select></td>
        <td>${esc(r.resolution ?? (r.resolved_at ? '완료' : ''))}</td>
        <td>${dt(r.created_at)}</td>
        <td>${dt(r.updated_at)}</td>
      </tr>`).join('')}</tbody></table>`;

  $$('#tablewrap th').forEach((th) => th.addEventListener('click', () => {
    const f = th.dataset.field;
    if (tableSort.field === f) tableSort.dir *= -1;
    else tableSort = { field: f, dir: 1 };
    renderTable();
  }));
  $$('#tablewrap .tstatus').forEach((sel) => sel.addEventListener('change', async () => {
    await api('/api/issue/' + encodeURIComponent(sel.dataset.key), { method: 'PATCH', json: { statusId: Number(sel.value) } });
    const row = tableRows.find((r) => r.issue_key === sel.dataset.key);
    const st = meta.statuses.find((s) => String(s.id) === sel.value);
    if (row && st) { row.status_id = st.id; row.status_name = st.name; row.status_category = st.category; }
    renderTable();
  }));
}

// ---------- 보드 (칸반) ----------
function boardColumns() {
  const b = boards.find((x) => String(x.id) === $('#board-sel').value);
  if (b) return b.columns.map((c) => ({ name: c.name, statusIds: c.statusIds.map(Number), custom: true }));
  return meta.statuses.map((s) => ({ name: s.name, statusIds: [Number(s.id)], category: s.category }));
}
async function loadBoard() {
  const rows = await api('/api/issues?' + filterParams());
  const cols = boardColumns();
  const colOf = new Map(); // statusId → column index
  cols.forEach((c, i) => c.statusIds.forEach((s) => colOf.set(s, i)));
  const buckets = cols.map(() => []);
  let hidden = 0;
  for (const r of rows) {
    const i = colOf.get(Number(r.status_id));
    if (i == null) { hidden++; continue; }
    buckets[i].push(r);
  }
  $('#count').textContent = `${rows.length}건`;
  $('#board-hidden').textContent = hidden ? `컬럼에 없는 상태의 이슈 ${hidden}건 숨김` : '';
  const statusName = (id) => meta.statuses.find((s) => Number(s.id) === id)?.name ?? id;
  $('#board').innerHTML = cols.map((c, i) => `
    <div class="col" data-col="${i}" title="${esc(c.statusIds.map(statusName).join(', '))}">
      <h4>${c.category ? `<span class="badge cat-${esc(c.category)}">${esc(c.name)}</span>` : `<b>${esc(c.name)}</b>`}
        <span class="dim">${buckets[i].length}</span></h4>
      <div class="cards">${buckets[i].map((r) => `
        <div class="card" draggable="true" data-key="${esc(r.issue_key)}" data-status="${r.status_id}">
          ${epicBar(r)}
          <div class="sum">${esc(r.summary)}</div>
          ${(r.labels ?? []).length ? `<div class="labels">${r.labels.map((l) => `<span class="chip">${esc(l)}</span>`).join('')}</div>` : ''}
          <div class="meta"><span class="ilink${r.status_category === 'done' ? ' done' : ''}" data-key="${esc(r.issue_key)}">${esc(r.issue_key)}</span>
            <span style="display:inline-flex;gap:6px;align-items:center">${prioIcon(r.priority)}${avatar(r.assignee_name)}</span></div>
        </div>`).join('')}</div>
    </div>`).join('');

  let dragKey = null, dragStatus = null;
  $$('#board .card').forEach((c) => {
    c.addEventListener('dragstart', () => { dragKey = c.dataset.key; dragStatus = Number(c.dataset.status); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  $$('#board .col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('dragover');
      if (!dragKey) return;
      const c = cols[Number(col.dataset.col)];
      if (c.statusIds.includes(dragStatus)) return; // 같은 컬럼이면 그대로
      await api('/api/issue/' + encodeURIComponent(dragKey), { method: 'PATCH', json: { statusId: c.statusIds[0] } });
      loadBoard();
    });
  });
}

// ---------- 보드 만들기/편집 ----------
let editingBoardId = null;
function colBlock(name = '', statusIds = []) {
  const id = 'bm' + Math.random().toString(36).slice(2, 8);

    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" class="bm-col-name" placeholder="컬럼 이름" value="${esc(name)}" style="flex:1">
      <button class="bm-col-del" title="컬럼 삭제">✕</button>
    </div>
    <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px">
      ${meta.statuses.map((s) => `<label style="font-size:12px;margin:0;display:inline-flex;gap:4px;align-items:center">
        <input type="checkbox" class="bm-st" name="${id}" value="${s.id}"${statusIds.includes(Number(s.id)) ? ' checked' : ''}>
        <span class="badge cat-${esc(s.category)}">${esc(s.name)}</span></label>`).join('')}
    </div>
  </div>`;
}
function openBoardModal(board = null) {
  editingBoardId = board?.id ?? null;
  $('#bm-title').textContent = board ? '보드 편집' : '보드 만들기';
  $('#bm-name').value = board?.name ?? '';
  const cols = board?.columns ?? [{ name: '해야 할 일' }, { name: '대기' }, { name: '진행 중' }, { name: '완료' }];
  $('#bm-cols').innerHTML = cols.map((c) => colBlock(c.name, (c.statusIds ?? []).map(Number))).join('');
  $('#board-modal').classList.add('on');
}
$('#board-new').addEventListener('click', () => openBoardModal());
$('#board-edit').addEventListener('click', () => {
  const b = boards.find((x) => String(x.id) === $('#board-sel').value);
  if (!b) return alert('편집할 보드를 선택하세요 (기본 보드는 편집 불가)');
  openBoardModal(b);
});
$('#board-del').addEventListener('click', async () => {
  const b = boards.find((x) => String(x.id) === $('#board-sel').value);
  if (!b) return alert('삭제할 보드를 선택하세요');
  if (!confirm(`보드 '${b.name}'을(를) 삭제할까요? (이슈는 삭제되지 않습니다)`)) return;
  await api('/api/boards/' + b.id, { method: 'DELETE' });
  $('#board-sel').value = '';
  await loadSprints(); loadBoard();
});
$('#bm-add-col').addEventListener('click', () => $('#bm-cols').insertAdjacentHTML('beforeend', colBlock()));
$('#bm-cols').addEventListener('click', (e) => {
  if (e.target.closest('.bm-col-del')) e.target.closest('.bm-col').remove();
});
$('#bm-cancel').addEventListener('click', () => $('#board-modal').classList.remove('on'));
$('#bm-save').addEventListener('click', async () => {
  const name = $('#bm-name').value.trim();
  if (!name) return alert('보드 이름을 입력하세요');
  const columns = $$('#bm-cols .bm-col').map((el) => ({
    name: el.querySelector('.bm-col-name').value.trim(),
    statusIds: [...el.querySelectorAll('.bm-st:checked')].map((c) => Number(c.value)),
  })).filter((c) => c.name || c.statusIds.length);
  const saved = editingBoardId
    ? await api('/api/boards/' + editingBoardId, { method: 'PATCH', json: { name, columns } })
    : await api('/api/boards', { method: 'POST', json: { projectKey: $('#f-project').value, name, columns } });
  $('#board-modal').classList.remove('on');
  await loadSprints();
  $('#board-sel').value = String(saved.id);
  loadBoard();
});
$('#board-sel').addEventListener('change', loadBoard);

// ---------- 백로그 (스프린트 + 인라인 계층) ----------
async function loadBacklog() {
  const qs = filterParams(); qs.delete('sprint');
  const rows = await api('/api/issues?' + qs);
  $('#count').textContent = `${rows.length}건`;
  const bySprint = new Map();
  for (const r of rows) {
    const k = r.sprint_id ?? 'none';
    if (!bySprint.has(k)) bySprint.set(k, []);
    bySprint.get(k).push(r);
  }
  const open = sprints.filter((s) => s.state !== 'closed');
  const sprintOpts = (cur) => '<option value="">백로그</option>' +
    open.map((s) => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  const statusOpts = (cur) => meta.statuses.map((st) =>
    `<option value="${st.id}"${String(st.id) === String(cur) ? ' selected' : ''}>${esc(st.name)}</option>`).join('');
  const issueRow = (r, extra = '', cls = '') => `
    <div class="srow ${cls}" data-id="${r.id}">
      ${epicBar(r)}${extra}
      <span class="key ilink${r.status_category === 'done' ? ' done' : ''}" data-key="${esc(r.issue_key)}">${esc(r.issue_key)}</span>
      <span class="sum">${esc(r.summary)}</span>
      ${(r.fix_versions ?? []).map((v) => `<span class="chip">${esc(v)}</span>`).join('')}
      <select class="bl-status tstatus cat-${esc(r.status_category)}" data-key="${esc(r.issue_key)}">${statusOpts(r.status_id)}</select>
      ${prioIcon(r.priority)}
      ${avatar(r.assignee_name)}
      <select class="mv" data-key="${esc(r.issue_key)}">${sprintOpts(r.sprint_id)}</select>
    </div>`;
  // 섹션 내 계층: 하위 작업은 부모가 같은 섹션에 있으면 부모 아래 접힌 상태로 들여쓰기
  const sectionRows = (list) => {
    const ids = new Set(list.map((r) => r.id));
    const childrenOf = new Map();
    for (const r of list) {
      if (r.subtask && r.parent_id && ids.has(r.parent_id)) {
        if (!childrenOf.has(r.parent_id)) childrenOf.set(r.parent_id, []);
        childrenOf.get(r.parent_id).push(r);
      }
    }
    const nested = new Set([...childrenOf.values()].flat().map((r) => r.id));
    return list.filter((r) => !nested.has(r.id)).map((r) => {
      const kids = childrenOf.get(r.id) ?? [];
      const twisty = kids.length
        ? `<button class="twisty" data-id="${r.id}" title="하위 작업 ${kids.length}개">▸</button>`
        : '';
      return issueRow(r, twisty)
        + kids.map((c) => issueRow(c, '', `child p${r.id}`).replace('class="srow', 'style="display:none" class="srow')).join('');
    }).join('');
  };
  const sprintBlock = (s) => {
    const list = bySprint.get(s.id) ?? [];
    const actions = s.state === 'future'
      ? `<button class="sp-start" data-id="${s.id}">스프린트 시작</button>`
      : s.state === 'active' ? `<button class="sp-close" data-id="${s.id}">스프린트 완료</button>` : '';
    return `<div class="sprint">
      <div class="shead"><b>${esc(s.name)}</b>
        <span class="badge ${s.state === 'active' ? 'cat-indeterminate' : s.state === 'closed' ? 'cat-done' : 'cat-new'}">${{future:'예정',active:'활성',closed:'완료'}[s.state]}</span>
        <span class="goal">${esc(s.goal ?? '')}${s.start_at ? ` · ${dt(s.start_at)} 시작` : ''}</span>
        <span class="dim">${list.length}건</span>${catChips(list)}${actions}</div>
      ${sectionRows(list) || '<div class="sempty">이슈 없음 — 아래 백로그에서 이동하세요</div>'}
    </div>`;
  };
  const backlogList = bySprint.get('none') ?? [];
  $('#backlog').innerHTML = `
    <div style="margin-bottom:12px"><button id="sp-new" class="primary">+ 스프린트 만들기</button></div>
    ${sprints.filter((s) => s.state === 'active').map(sprintBlock).join('')}
    ${sprints.filter((s) => s.state === 'future').map(sprintBlock).join('')}
    <div class="sprint"><div class="shead"><b>백로그</b><span class="dim">${backlogList.length}건</span>${catChips(backlogList)}</div>
      ${sectionRows(backlogList) || '<div class="sempty">백로그가 비어 있습니다</div>'}</div>
    ${sprints.filter((s) => s.state === 'closed').map(sprintBlock).join('')}`;

  // 하위 작업 펼침/접기
  $$('#backlog .twisty').forEach((b) => b.addEventListener('click', () => {
    const openNow = b.textContent === '▾';
    b.textContent = openNow ? '▸' : '▾';
    $$(`#backlog .srow.p${b.dataset.id}`).forEach((el) => { el.style.display = openNow ? 'none' : ''; });
  }));
  // 인라인 상태 변경
  $$('#backlog .bl-status').forEach((sel) => sel.addEventListener('change', async () => {
    await api('/api/issue/' + encodeURIComponent(sel.dataset.key), { method: 'PATCH', json: { statusId: Number(sel.value) } });
    loadBacklog();
  }));

  $('#sp-new').addEventListener('click', async () => {
    const name = prompt('스프린트 이름'); if (!name?.trim()) return;
    const goal = prompt('목표 (선택)') ?? '';
    await api('/api/sprints', { method: 'POST', json: { projectKey: $('#f-project').value, name, goal } });
    await loadSprints(); loadBacklog();
  });
  $$('#backlog .sp-start').forEach((b) => b.addEventListener('click', async () => {
    await api('/api/sprints/' + b.dataset.id, { method: 'PATCH', json: { state: 'active' } });
    await loadSprints(); loadBacklog();
  }));
  $$('#backlog .sp-close').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('스프린트를 완료할까요? 미완료 이슈는 백로그로 돌아갑니다.')) return;
    await api('/api/sprints/' + b.dataset.id, { method: 'PATCH', json: { state: 'closed' } });
    await loadSprints(); loadBacklog();
  }));
  $$('#backlog .mv').forEach((sel) => sel.addEventListener('change', async () => {
    await api('/api/issue/' + encodeURIComponent(sel.dataset.key),
      { method: 'PATCH', json: { sprintId: sel.value ? Number(sel.value) : null } });
    loadBacklog();
  }));
}

// ---------- 이슈 만들기 ----------
$('#btn-new').addEventListener('click', () => {
  $('#n-summary').value = ''; $('#n-desc').value = ''; $('#n-parent').value = '';
  $('#new-issue').classList.add('on');
});
$('#n-cancel').addEventListener('click', () => $('#new-issue').classList.remove('on'));
$('#n-type').addEventListener('change', () => {
  const sub = $('#n-type').selectedOptions[0]?.dataset.sub === 'true';
  $('#n-parent-wrap').style.display = sub ? '' : 'none';
});
$('#n-create').addEventListener('click', async () => {
  const sub = $('#n-type').selectedOptions[0]?.dataset.sub === 'true';
  const res = await api('/api/issues', { method: 'POST', json: {
    projectKey: $('#f-project').value,
    typeId: Number($('#n-type').value),
    summary: $('#n-summary').value,
    description: $('#n-desc').value,
    assigneeId: $('#n-assignee').value ? Number($('#n-assignee').value) : null,
    priority: $('#n-priority').value || null,
    sprintId: $('#n-sprint').value ? Number($('#n-sprint').value) : null,
    parentKey: sub ? $('#n-parent').value : null,
  }});
  $('#new-issue').classList.remove('on');
  refresh();
  if (curView === 'list') openIssue(res.issueKey);
});

// ---------- 필터 ----------
for (const id of ['#f-project', ...FILTER_IDS]) $(id).addEventListener('change', () => {
  if (id === '#f-project') { loadSprints().then(() => { refresh(); syncViewUrl(); }); } else refresh();
});
let qTimer; $('#f-q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(refresh, 250); });
$('#f-group').addEventListener('change', () => { if (curView === 'table') renderTable(); });
$('#btn-clear').addEventListener('click', () => {
  for (const id of FILTER_IDS) $(id).value = '';
  $('#f-q').value = ''; $('#f-saved').value = ''; $('#f-group').value = '';
  refresh();
});
$('#btn-save-filter').addEventListener('click', async () => {
  const name = prompt('필터 이름'); if (!name?.trim()) return;
  const params = {};
  for (const id of FILTER_IDS) if ($(id).value) params[id] = $(id).value;
  if ($('#f-q').value) params['#f-q'] = $('#f-q').value;
  await api('/api/filters', { method: 'POST', json: { name, params } });
  await loadSavedFilters();
});
$('#f-saved').addEventListener('change', () => {
  const f = savedFilters.find((x) => String(x.id) === $('#f-saved').value);
  if (!f) return;
  for (const id of [...FILTER_IDS, '#f-q']) $(id).value = f.params[id] ?? '';
  refresh();
});
$('#btn-del-filter').addEventListener('click', async () => {
  const id = $('#f-saved').value; if (!id) return alert('삭제할 저장 필터를 선택하세요');
  if (!confirm('저장된 필터를 삭제할까요?')) return;
  await api('/api/filters/' + id, { method: 'DELETE' });
  await loadSavedFilters();
});

// ---------- 공용 이벤트 ----------
$('#list').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) openIssue(r.dataset.key); });
document.body.addEventListener('click', (e) => {
  const l = e.target.closest('.ilink'); if (l) openIssue(l.dataset.key, true);
});

init().catch(() => {});
</script>
</body>
</html>
